<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8eb">
  <title>CHENG HUI Game Lab | 物理教学与游戏创作</title>
  <style>
    :root{--paper:#fff8eb;--ink:#172b48;--indigo:#3159db;--red:#f26b4e;--green:#277f72;--line:#dbe0e1}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.7}button,a{font:inherit}a{color:var(--indigo)}a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
    .shell{width:min(100% - 40px,1040px);margin-inline:auto}.site-header{border-bottom:1px solid var(--line);background:rgba(255,248,235,.96)}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}.brand{font-weight:800;letter-spacing:.09em;text-decoration:none;color:var(--indigo)}.brand small{display:block;font-size:.67rem;font-weight:500;letter-spacing:.19em;color:var(--green)}nav{display:flex;flex-wrap:wrap;gap:8px 22px}nav a{text-decoration:none;font-size:.94rem}nav a:hover{text-decoration:underline}
    .hero{padding:clamp(55px,9vw,105px) 0 60px;border-bottom:1px solid var(--line)}.eyebrow{font-size:.8rem;letter-spacing:.18em;font-weight:700;color:var(--red)}h1,h2,h3,p{margin-top:0}h1{font-family:Georgia,"Noto Serif SC",serif;color:var(--indigo);font-size:clamp(2.7rem,7vw,5.5rem);line-height:1.1;letter-spacing:-.04em;margin:18px 0 24px}h1 span{display:block;font-family:system-ui,"Noto Sans SC",sans-serif;font-size:clamp(1.1rem,2.8vw,1.7rem);font-weight:500;letter-spacing:0;margin-top:20px}.intro{max-width:680px;font-size:1.1rem;color:#42505a}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.button{display:inline-block;padding:10px 19px;border-radius:5px;border:1px solid var(--indigo);text-decoration:none;background:var(--indigo);color:#fff;cursor:pointer}.button.secondary{background:transparent;color:var(--indigo)}.button:hover{filter:brightness(1.12)}
    section{padding:70px 0;border-bottom:1px solid var(--line)}.section-kicker{color:var(--red);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h2{font-family:Georgia,"Noto Serif SC",serif;color:var(--indigo);font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.25;margin:8px 0 18px}.muted{color:#53617b}.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:50px}.note{padding:24px;border:1px solid var(--line);background:#fffdf8;border-left:3px solid var(--green)}.note h3{font-size:1.08rem;color:var(--indigo)}
    .game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:27px 0}.game-card{width:100%;padding:20px;text-align:left;border:1px solid var(--line);border-radius:7px;background:#fffdf8;color:var(--ink);cursor:pointer;min-height:105px}.game-card:hover,.game-card[aria-pressed="true"]{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}.game-card strong{display:block;color:var(--indigo);font-size:1.06rem}.game-card span{font-size:.82rem;color:#53617b}.play-header{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:14px}.play-header h3{margin:0;color:var(--indigo)}.play-actions{display:flex;flex-wrap:wrap;gap:9px}.play-actions .button{font-size:.87rem;padding:8px 12px}.game-wrapper{position:relative;aspect-ratio:16/9;background:#222b30;border:2px solid var(--indigo);border-radius:6px;overflow:hidden}.game-wrapper iframe{display:block;width:100%;height:100%;border:0}.game-wrapper:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}.game-tip{font-size:.86rem;margin-top:12px}.future{margin:25px 0 0;color:#53617b;font-size:.9rem}
    footer{padding:32px 0;color:#53617b;font-size:.87rem}@media(max-width:700px){.header-inner{padding:16px 0;align-items:flex-start;flex-direction:column;gap:10px}nav{gap:8px 17px}.hero{padding:62px 0 52px}section{padding:55px 0}.two-col{grid-template-columns:1fr;gap:18px}.game-grid{grid-template-columns:1fr;gap:9px}.game-card{min-height:70px;padding:12px 16px}.game-wrapper{aspect-ratio:4/3}.game-tip{max-width:36ch}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    .site-header .header-inner{flex-wrap:wrap}.language{display:flex;gap:3px;border:1px solid var(--indigo);border-radius:30px;padding:3px}.language button{border:0;border-radius:25px;background:transparent;padding:3px 9px;color:var(--indigo);cursor:pointer;font-size:.8rem;font-weight:700}.language button[aria-pressed="true"]{background:var(--indigo);color:#fff}.hero{background:var(--indigo);color:#fff;position:relative;overflow:hidden;padding:85px 0}.hero:after{content:"✦";position:absolute;right:6%;top:4%;font-size:clamp(140px,26vw,340px);line-height:1;color:var(--red);opacity:.85;pointer-events:none}.hero .shell{position:relative;z-index:1}.hero h1,.hero h1 span{color:#fff}.hero h1{font-size:clamp(3rem,8vw,6rem);letter-spacing:-.06em}.hero .intro{color:#fff;font-size:1.4rem;font-weight:600}.hero .eyebrow{color:#ffcf9b}.hero .button{background:var(--red);border-color:var(--red);color:#1e2334;border-radius:30px;font-weight:700}.game-card[aria-pressed="true"]{background:#e9efff}.game-card:hover{background:#e9efff}.game-wrapper{border-radius:10px}.note{background:#d9f4de}.about-section{background:#d9f4de}.writing-section{background:#fffdf8}@media(max-width:700px){.language{margin-left:auto}.hero{padding:65px 0}.hero:after{right:-40px;opacity:.25}.intro{max-width:16ch}}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="#top">CHENG HUI ✦ GAME LAB</a><nav aria-label="Navigation"><a href="#about" data-zh="关于" data-en="About">关于</a><a href="#games" data-zh="游戏" data-en="Games">游戏</a><a href="#writing" data-zh="创作" data-en="Writing">创作</a></nav><div class="language" role="group" aria-label="Language / 语言"><button type="button" data-lang="zh" aria-pressed="true">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div></header>
  <main id="top">
    <div class="hero"><div class="shell"><div class="eyebrow">PHYSICS · PLAY · IDEAS</div><h1>CHENG HUI.</h1><p class="intro" data-zh="把物理课堂，变成一场探索。" data-en="Turn physics into an adventure.">把物理课堂，变成一场探索。</p><a class="button" href="#games" data-zh="开始试玩 ↗" data-en="Play games ↗">开始试玩 ↗</a></div></div>
    <section id="about" class="about-section"><div class="shell"><h2 data-zh="你好，我是郑晖。" data-en="Hi, I'm Cheng Hui.">你好，我是郑晖。</h2><p data-zh="物理教师。喜欢用游戏、创作与实验探索学习。" data-en="Physics teacher. Exploring learning through games, making and experiments.">物理教师。喜欢用游戏、创作与实验探索学习。</p></div></section>
    <section id="games"><div class="shell"><h2 data-zh="来玩一场。" data-en="Let's play.">来玩一场。</h2><div class="game-grid" role="group" aria-label="Games"><button class="game-card" type="button" data-src="./games/kluang_cross/index.html" data-zh-name="居銮群侠传" data-en-name="Kluang Cross" aria-pressed="true"><strong data-zh="居銮群侠传" data-en="Kluang Cross">居銮群侠传</strong></button><button class="game-card" type="button" data-src="./games/physics_rpg/index.html" data-zh-name="Physics RPG" data-en-name="Physics RPG" aria-pressed="false"><strong>Physics RPG</strong></button><button class="game-card" type="button" data-src="./games/final_masterpiece/index.html" data-zh-name="Final Masterpiece" data-en-name="Final Masterpiece" aria-pressed="false"><strong>Final Masterpiece</strong></button></div><div class="play-header"><h3 id="current-game">居銮群侠传</h3><div class="play-actions"><a id="open-game" class="button secondary" href="./games/kluang_cross/index.html" target="_blank" rel="noopener" data-zh="单独打开 ↗" data-en="Open game ↗">单独打开 ↗</a><button id="fullscreen-game" class="button" type="button" data-zh="全屏" data-en="Fullscreen">全屏</button></div></div><div class="game-wrapper" id="game-container"><iframe id="game-frame" src="./games/kluang_cross/index.html" title="居銮群侠传" allow="fullscreen" allowfullscreen loading="lazy"></iframe></div></div></section>
    <section id="writing" class="writing-section"><div class="shell"><h2 data-zh="不止物理。" data-en="Beyond physics.">不止物理。</h2><p data-zh="电影、写作和一些新点子，陆续更新。" data-en="Films, writing and new ideas. More to come.">电影、写作和一些新点子，陆续更新。</p></div></section>
  </main><footer><div class="shell">© 2026 CHENG HUI · GAME LAB</div></footer>
  <script>
    const cards=[...document.querySelectorAll('.game-card')],frame=document.getElementById('game-frame'),link=document.getElementById('open-game'),title=document.getElementById('current-game');
    let language='zh';
    function updateGameTitle(){const card=cards.find(item=>item.getAttribute('aria-pressed')==='true'),name=card.dataset[language+'Name'];title.textContent=name;frame.title=name;}
    cards.forEach(card=>card.addEventListener('click',()=>{cards.forEach(item=>item.setAttribute('aria-pressed',String(item===card)));link.href=card.dataset.src;if(frame.getAttribute('src')!==card.dataset.src)frame.src=card.dataset.src;updateGameTitle();}));
    document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{language=button.dataset.lang;document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh][data-en]').forEach(element=>element.textContent=element.dataset[language]);document.querySelectorAll('[data-lang]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));updateGameTitle();try{localStorage.setItem('ch-game-lab-lang',language)}catch{}}));
    try{if(localStorage.getItem('ch-game-lab-lang')==='en')document.querySelector('[data-lang="en"]').click()}catch{}
    document.getElementById('fullscreen-game').addEventListener('click',()=>{const wrapper=document.getElementById('game-container');if(wrapper.requestFullscreen)wrapper.requestFullscreen().catch(()=>window.open(link.href,'_blank','noopener'));else window.open(link.href,'_blank','noopener')});
  </script>
</body>
</html>
